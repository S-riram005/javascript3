<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
        //bitwise operator
        // const a=2;
        // const b=3;
        // console.log(a&b);

        let a=12;
        let b=24;
        console.log(a&b);


        //&=     assignment operator

        a&=b;
        console.log(a);


        //bitwise or operator

         a=12;
         b=24;
        console.log(a|b);


        a|=b;
        console.log(a);

        //~ operator ~a=-a-1    ~25=-25-1  =-26    --+=26 it converts the -symbol -26
        a=25;
        console.log(~a);

        //^ operator:   0 to 1 is the comes the 1 it opposite convert bite 1 : 1 to 1 =1
        a=2;//10
        b=3;//11
        console.log(a^b);

        a=24;//10
        b=16;//11
        console.log(a^b);

        //<<
        a=5;
        b=2;
        console.log(a<<b);
        a<<=b;
        console.log(a);

        //>>
        a=5;
        b=2;
        console.log(a>>b);

        a>>=b;
        console.log(a);




    </script>
    
</body>

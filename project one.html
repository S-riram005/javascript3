<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project-1:Countdown Timer</title>
    <link rel="stylesheet" href="project one.css">
</head>
<body>
    <img src="assests/images.jpg" alt="Happy New Year 2026" class="full-screen-image">

    <img src="assests/download.png" alt="My Image" class="my-image">

    <h2>Comming Soon</h2>
    <p>our website is under construction,follow us for update now !</p>
    <div class="counter">
        <div class="box">
            <h2 id="days">00</h2>
            <small>Days</small>
        </div>
        <div class="box">
            <h2 id="hours">00</h2>
            <small>Hours</small>
        </div>
        <div class="box">
            <h2 id="minutes">00</h2>
            <small>Minutes</small>
        </div>
        <div class="box">
            <h2 id="seconds">00</h2>
            <small>Seconds</small>
        </div>
       
    </div>
     <div class="form">
            <input type="text" placeholder="Email Address">
            <button>Notify</button>
        </div>
    <Script src="project one.js"></Script>
    
</body>
</html>

       function validateInput(minLength) {
    return function(maxLength) {
        return function(input) {
            if (input.length < minLength) return `Input too short. Minimum is ${minLength}`;
            if (input.length > maxLength) return `Input too long. Maximum is ${maxLength}`;
            return "Valid input";
        };
    };
}

// Example usage:
const validate = validateInput(3)(10);
console.log(validate("Hello")); // Valid input
console.log(validate("Hi"));    // Input too short. Minimum is 3
console.log(validate("Hello World! This is too long")); // Input too long. Maximum is 10

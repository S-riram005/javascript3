        /*
        1.create a class called circle
        2.radius values a constructor
        3.getter and setter function called diammeter
        4.getter area()
        */

        class Circle {
    constructor(radius) {
        this.radius = radius;
    }
    get diameter() {
        return this.radius * 2;
    }
    set diameter(diameter) {
        this.radius = diameter / 2;
    }
    get area() {
        return Math.PI * this.radius * this.radius;
    }
}

const myCircle = new Circle(5);
console.log(myCircle.radius);    // 5
console.log(myCircle.diameter);  // 10
console.log(myCircle.area);      // 78.53981633974483
myCircle.diameter = 12;
console.log(myCircle.radius);    // 6
console.log(myCircle.diameter);  // 12
console.log(myCircle.area);      // 113.09733552923255

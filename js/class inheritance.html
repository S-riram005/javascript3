class person{
            constructor(name){
                this.name=name;
            }
            sayHello(){
                            console.log("Hello,my name is"+ this.name);


            }
        }
        var p1=new person("sriram");
        console.log(p1);
        p1.sayHello();

        class student extends person
        {

        this.name+" age is "+this.age+" "+(this.age>=18?"Eligible":"Not Eligible")

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <Script>
        //nested if statement
        /*
        if(condition){
        set of statements
        if(condition){
        set of statements          this is syntax of nested if
        }
        }
        min max>=35;                pass
        91-100 A Grade
        81-90  B Grade
        71-80  C Grade
        D Grade

        */
       let english=95, tamil=98, maths=82;
       let total,avg;
       total=english+tamil+maths;
       avg=total/3;
       console.log("Total:"+total);
       console.log("Average:"+avg.toFixed(2));

       if(english>=35&&tamil>=35&&maths>=35){
        console.log("Result : Pass")
        if(avg>91&&avg<=100){
            console.log("Grade : A Grade")  
            }else if(avg>80&&avg<=90){
                console.log("Grade : B Grade")
            }else if(avg>70&&avg<=80){
                console.log("Grade : C Grade")
            }
       }
       else{
        console.log("Result : fail")
        
       }

    </Script>
    
</body>

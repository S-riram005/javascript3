<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //example 1
        let number=-5;
        if(number<0){
            console.log(number+" is negative Number");
        }
        else if(number>0){
            console.log(number+" is positive Number");
        }
        else{
            console.log(" Given Number is Zero" )
        }

        //example 2

        /*
        90-100 A grade
        80-89 B grade
        70-79 c Grade
        <70 D grade

        */

        let avg=65;
        if(avg>=90&&avg<=100){
            console.log("A Grade");
        }
        else if(avg>=80&&avg<=89){
            console.log("B Grade");
        }
        else if(avg>=70&&avg<=79){
            console.log("C Grade");
        }
        else{
            console.log("D Grade");
        }
        

    </script>
    
</body>
</html>

   const studentMethod = {
    about: function () {
        return `${this.fullName} is from ${this.city}`;
    },
    eligiblity: function () {
        return this.age > 18;
    },
};

function addStudent(fullName, father, age, address, city) {
    const users = Object.create(studentMethod);
    users.fullName = fullName;
    users.father = father;
    users.age = age;
    users.address = address;
    users.city = city;

    return users;
}

const student = addStudent("Sriram", "Rajkumar", 22, "Annanagar", "Madurai");

console.log(student);                 // Object with properties + prototype methods
console.log(student.about());        // "Sriram is from Madurai"
console.log(student.eligiblity());   // true

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //it is the grouping statement in the  of the switch case
        let letter= 'a';
        switch(letter){
            case 'a':
            case 'e':
            case 'i':
            case 'o':
            case 'u':
            case 'A':
            case 'E':
            case 'I':
            case 'O':
            case 'U':
                console.log(letter + "is an vowel word");
                break;
                default:
                console.log(letter +"is  not vowel word");
        }
    </script>
    
</body>
</html>

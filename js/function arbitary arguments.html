<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sum(){
            let total=0;
            for(let i=0;i<arguments.length;i++){
                total+=arguments[i];
            }
            return total;
        }
        console.log(sum(12,12));
        console.log(sum(10,20,30,30,10))

        //spread  operator
function total(...args){
            let total=0;
            for(let i=0;i<args.length;i++){
                total+=args[i];
            }
            return total;
        }
        console.log(total(12,12));
        console.log(total(10,20,30,30,10))
    </script>
    
</body>
</html>

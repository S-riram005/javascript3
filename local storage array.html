<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD With Local Storage</title>
</head>
<body>
    <div class="container">
        <h1>CRUD With Local Storage</h1>
        <form id="dataForm">
            <label for="dataInput">Enter Data:</label>
            <input type="text" id="dataInput"/>
            <button type="submit">Add Data</button>
        </form>

        <div id="output">
            <h2>Stored Data</h2>
            <ul id="dataList"></ul>
        </div>
    </div>

    <link rel="stylesheet" href="local storage array.css"/>
    <script src="local storage .js"></script>
</body>
</html>

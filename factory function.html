<!DOCTYPE html>

<body>
    <Script>
        //Function Factory
        /*
        5=>10
        5=>15
        */
       function makeMultipler(multiplier){
        return function(number){
            return multiplier*number;
        };
       }
       const double=makeMultipler(2);
       const triple=makeMultipler(3);

       console.log(double(5));
       console.log(triple(5));

    </Script>
    
</body>
</html>

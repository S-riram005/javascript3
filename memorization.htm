    <script>
        //memorization
        /*
        function factorial(n){

            let fact=1;

                fact=fact*i;
            }
            return fact;
        }
            */

        function memoize(fn){
            const cache={};
            return function(n){
                console.log("cache: ",cache);
                const key=n;
                if(cache[key]){
                    console.log("Data Already Found");
                    return cache[key];
                }
                const result=fn(n);
                cache[key]=result;
                return result;

            };

        };

        const factorial=memoize(function(n){
            console.log("Function Running");
            let fact=1;
            for(let i=1;i<=n;i++){
                fact=fact*i;
            }
            return fact;
        });



        console.log(factorial(5));
        console.log(factorial(5));
        console.log(factorial(5));
        
    </script>

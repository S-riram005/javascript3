        <ul>
        <li>Write the function createCounter</li>
        <li>Implement the methods increment, decrement, and getcount within the function</li>
    </ul>
    <script>

    
        function createCounter(){
            let count=0;
            return {
                increment: ()=> ++count,
                decrement: ()=> --count,
                getcount: ()=> count,
            };
        }

        const counter = createCounter();

        console.log(counter.getcount());  
        console.log(counter.increment());  
        console.log(counter.increment()); 
        console.log(counter.getcount());   
        console.log(counter.decrement()); 
       
    </Script>
    
</body>
